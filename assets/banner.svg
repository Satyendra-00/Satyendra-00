 <circle cx="410" cy="85" r="30" fill="none" stroke="#00D9FF" stroke-width="2" opacity=".7"/>
 <path d="M395 85h30M410 70v30" stroke="#A855F7" stroke-width="4" stroke-linecap="round"/>
 <!-- floating cards -->
