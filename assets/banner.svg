<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="460" viewBox="0 0 1280 460">
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#070A12"/><stop offset=".55" stop-color="#0B1020"/><stop offset="1" stop-color="#111936"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#00D9FF"/><stop offset=".5" stop-color="#6D5BFF"/><stop offset="1" stop-color="#A855F7"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#151B31"/><stop offset="1" stop-color="#0D1223"/></linearGradient>
 <radialGradient id="halo"><stop stop-color="#5B5FFF" stop-opacity=".24"/><stop offset="1" stop-color="#5B5FFF" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="glow"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
 <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#8B96B8" stroke-opacity=".055"/></pattern>
</defs>

<rect width="1280" height="460" rx="22" fill="url(#bg)"/>
<rect width="1280" height="460" rx="22" fill="url(#grid)"/>
<circle cx="1010" cy="225" r="245" fill="url(#halo)"/>
<circle cx="1050" cy="225" r="150" fill="#625BFF" opacity=".08" filter="url(#blur)"/>

<!-- floating symbols -->
<g font-family="Segoe UI,Arial,sans-serif" font-weight="700" fill="url(#neon)" opacity=".8">
 <text x="760" y="72" font-size="34">&lt;/&gt;</text><text x="1160" y="110" font-size="28">{ }</text>
 <text x="730" y="385" font-size="25">AI</text><text x="1170" y="365" font-size="30">01</text>
</g>
<g fill="none" stroke="#6D5BFF" opacity=".38">
 <circle cx="1160" cy="250" r="112"/><circle cx="1160" cy="250" r="92"/><path d="M1048 250h224M1160 138v224"/>
</g>

<!-- left copy -->
<text x="72" y="70" fill="#7180A4" font-family="Segoe UI,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="4">SATYENDRA-00 / PROFILE</text>
<text x="72" y="145" fill="#F8FAFC" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800">Hi! I'm Satyendra.</text>
<text x="76" y="190" fill="#8B9CFF" font-family="Segoe UI,Arial,sans-serif" font-size="25" font-weight="700">AI &amp; Software Engineer</text>
<text x="76" y="226" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Researching ideas. Building products.</text>
<text x="76" y="252" fill="#CBD5E1" font-family="Segoe UI,Arial,sans-serif" font-size="17">Solving real-world problems with technology.</text>

<!-- terminal card -->
<rect x="72" y="292" width="515" height="106" rx="12" fill="url(#card)" stroke="#27304A"/>
<circle cx="94" cy="313" r="5" fill="#FF5F57"/><circle cx="112" cy="313" r="5" fill="#FEBC2E"/><circle cx="130" cy="313" r="5" fill="#28C840"/>
<text x="92" y="345" fill="#64748B" font-family="JetBrains Mono,monospace" font-size="13">$ whoami</text>
<text x="92" y="372" fill="#00D9FF" font-family="JetBrains Mono,monospace" font-size="15">builder@research-lab:~$ ship()</text>
<rect x="390" y="362" width="8" height="17" fill="#00D9FF" opacity=".9"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>

<!-- right developer workstation illustration -->
<g transform="translate(810 92)">
 <ellipse cx="210" cy="290" rx="205" ry="30" fill="#000" opacity=".32"/>
 <!-- monitor -->
 <rect x="58" y="92" width="310" height="184" rx="14" fill="#090D18" stroke="#5361A0" stroke-width="3"/>
 <rect x="72" y="106" width="282" height="156" rx="8" fill="#11172A"/>
 <circle cx="88" cy="122" r="4" fill="#FF5F57"/><circle cx="101" cy="122" r="4" fill="#FEBC2E"/><circle cx="114" cy="122" r="4" fill="#28C840"/>
 <g font-family="JetBrains Mono,monospace" font-size="11">
  <text x="90" y="150" fill="#64748B">01</text><text x="110" y="150" fill="#8B9CFF">const</text><text x="154" y="150" fill="#E2E8F0">builder</text><text x="208" y="150" fill="#00D9FF">=</text><text x="222" y="150" fill="#A855F7">AI</text>
  <text x="90" y="171" fill="#64748B">02</text><text x="110" y="171" fill="#22C55E">research</text><text x="170" y="171" fill="#E2E8F0">(problem);</text>
  <text x="90" y="192" fill="#64748B">03</text><text x="110" y="192" fill="#8B9CFF">build</text><text x="152" y="192" fill="#E2E8F0">(solution);</text>
  <text x="90" y="213" fill="#64748B">04</text><text x="110" y="213" fill="#00D9FF">ship</text><text x="150" y="213" fill="#E2E8F0">(product);</text>
  <text x="90" y="234" fill="#64748B">05</text><text x="110" y="234" fill="#F8FAFC">// repeat</text>
 </g>
 <path d="M184 276h58l18 32h-94z" fill="#242B42" stroke="#5361A0"/>
