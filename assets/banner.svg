 <text x="16" y="62" fill="#7180A4" font-family="Segoe UI,Arial" font-size="10">CURRENT MODE</text>
 <text x="16" y="82" fill="#22C55E" font-family="Segoe UI,Arial" font-size="14" font-weight="700">BUILDING</text>
 <rect x="325" y="220" width="120" height="58" rx="12" fill="#11172A" stroke="#27304A"/>
 <text x="341" y="244" fill="#7180A4" font-family="Segoe UI,Arial" font-size="10">FOCUS</text>
 <text x="341" y="264" fill="#00D9FF" font-family="Segoe UI,Arial" font-size="13" font-weight="700">INTELLIGENCE</text>
</g>

<!-- bottom accent -->
<rect x="72" y="425" width="1136" height="2" rx="1" fill="url(#neon)" opacity=".85" filter="url(#glow)"/>
<text x="72" y="446" fill="#53617F" font-family="Segoe UI,Arial,sans-serif" font-size="11" letter-spacing="2">RESEARCH • BUILD • INNOVATE</text>
<text x="1208" y="446" text-anchor="end" fill="#53617F" font-family="JetBrains Mono,monospace" font-size="11">v2.0</text>

